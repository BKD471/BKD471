<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1430" viewBox="0 0 1200 1430" role="img" aria-labelledby="title desc">
<title id="title">OP Online Payments — conceptual target Azure architecture</title>
<desc id="desc">Customers reach the SMN frontend through Application Gateway and WAF. Merchants and internal clerks use Apigee and the payment or merchant APIs to reach the SMN business service. The frontend uses a private API route. Kubernetes CronJobs independently launch billing and cleanup Spring Batch jobs. Application and batch dependencies include PostgreSQL, Redis, Azure Blob Storage, Key Vault and Helm configuration. OP banking APIs and remaining cross-cloud integrations are separate dependencies. This is a grouped target view of the AWS-to-Azure migration.</desc>
